<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虚拟跑步 · 路线模拟器</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1724;color:#e8f1fa;font:15px system-ui}main{max-width:1150px;margin:auto;padding:30px}h1{font-size:28px}p{color:#a6b8cb;line-height:1.7}.grid{display:grid;grid-template-columns:300px 1fr;gap:22px}.panel{background:#162538;border:1px solid #2b4058;border-radius:18px;padding:22px}label{display:block;margin:15px 0 6px;color:#b9cbdf}input,select,button{width:100%;padding:11px;border:1px solid #3a5069;border-radius:8px;background:#101d2d;color:#fff;font:inherit}button{cursor:pointer;margin-top:12px;background:#2776b7}button:hover{filter:brightness(1.2)}.row{display:flex;gap:10px}.stats{display:flex;gap:28px;flex-wrap:wrap;padding-bottom:18px}.stats strong{display:block;font-size:26px;color:#5cdec5}.stats span{color:#a6b8cb}canvas{width:100%;height:440px;background:#101d2c;border-radius:12px}#status{min-height:25px;color:#6de4cb}.hint{font-size:12px}a{color:#69c8ff}@media(max-width:750px){.grid{grid-template-columns:1fr}main{padding:16px}}</style>
<main><h1>虚拟跑步 · 路线模拟器</h1><p>设置起点和跑步速度，沿起点周围的环形路线模拟运动。离线运行，轨迹可导出为 GPX 或 JSON。</p><div class="grid"><section class="panel"><label>起点纬度（WGS84）</label><input id="lat" type="number" value="31.2304" step="0.000001" min="-85" max="85"><label>起点经度（WGS84）</label><input id="lon" type="number" value="121.4737" step="0.000001" min="-180" max="180"><button id="locate">使用电脑定位</button><label>环形路线半径（米）</label><input id="radius" type="number" value="150" min="10" max="10000"><label>速度（公里/小时）</label><input id="speed" type="number" value="8" min="0.5" max="30" step="0.5"><label>目标距离（公里）</label><input id="target" type="number" value="3" min="0.1" max="100" step="0.1"><label>播放倍率</label><select id="rate"><option value="1">1× 实时</option><option value="10">10×</option><option value="60">60×</option></select><div class="row"><button id="start">开始</button><button id="pause">暂停</button></div><button id="reset">重置 / 应用设置</button><div class="row"><button id="gpx">导出 GPX</button><button id="json">导出 JSON</button></div><p class="hint">预览为本地米制坐标图，背景不是实际道路地图。模拟数据不会自动传入安小信。</p></section><section class="panel"><div class="stats"><div><strong id="distance">0.000</strong><span>公里</span></div><div><strong id="duration">00:00:00</strong><span>模拟时长</span></div><div><strong id="pace">7:30</strong><span>分钟 / 公里</span></div></div><canvas id="canvas"></canvas><p id="coords"></p><p id="status" role="status">准备就绪</p><p class="hint">浅色虚线：规划路线　绿色：已跑轨迹　亮点：当前位置<br>起点位于圆周，跑步沿圆周连续移动。播放倍率仅改变预览速度，导出时间按实际跑速计算。</p></section></div></main>
<script>
const $=id=>document.getElementById(id), R=6371000; let cfg,elapsed=0,points=[],running=false,last=0,base;
function settings(){const c={lat:+$('lat').value,lon:+$('lon').value,radius:+$('radius').value,speed:+$('speed').value,target:+$('target').value*1000}; if(!Object.values(c).every(Number.isFinite)||Math.abs(c.lat)>85||Math.abs(c.lon)>180||c.radius<10||c.radius>10000||c.speed<.5||c.speed>30||c.target<100||c.target>100000)throw Error('请输入有效设置：纬度 ±85，经度 ±180，半径 10–10000 米，速度 0.5–30，距离 0.1–100 公里。');return c}
function position(d){const a=d/cfg.radius,x=cfg.radius*Math.sin(a),y=cfg.radius*(1-Math.cos(a));const bearing=Math.atan2(x,y),angular=Math.hypot(x,y)/R,phi=cfg.lat*Math.PI/180,lambda=cfg.lon*Math.PI/180;const p=Math.asin(Math.sin(phi)*Math.cos(angular)+Math.cos(phi)*Math.sin(angular)*Math.cos(bearing));const l=lambda+Math.atan2(Math.sin(bearing)*Math.sin(angular)*Math.cos(phi),Math.cos(angular)-Math.sin(phi)*Math.sin(p));return {lat:p*180/Math.PI,lon:((l*180/Math.PI+540)%360)-180,x,y}}
function add(t){const d=Math.min(t*cfg.speed/3.6,cfg.target);points.push({...position(d),time:new Date(base+t*1000).toISOString(),distance:d})}
function reset(){try{const c=settings();running=false;cfg=c;elapsed=0;points=[];base=Date.now();add(0);$('status').textContent='准备就绪';draw()}catch(e){$('status').textContent=e.message}}
function draw(){if(!cfg)return;const cv=$('canvas'),w=cv.clientWidth,h=cv.clientHeight,dpr=devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);const scale=Math.min(w-70,h-70)/(cfg.radius*2),xy=p=>[w/2+p.x*scale,h/2-(p.y-cfg.radius)*scale];ctx.strokeStyle='#20364b';ctx.lineWidth=1;for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.setLineDash([6,6]);ctx.strokeStyle='#55758d';ctx.beginPath();ctx.arc(w/2,h/2,cfg.radius*scale,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#51dec2';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<points.length;i++){const [x,y]=xy(points[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();const p=points[points.length-1], [x,y]=xy(p);ctx.fillStyle='#a3ffe7';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c0d0df';ctx.font='12px system-ui';ctx.fillText('起点',w/2+10,h/2+cfg.radius*scale);ctx.fillText('半径 '+cfg.radius+' 米',12,22);$('distance').textContent=(p.distance/1000).toFixed(3);const s=Math.floor(elapsed);$('duration').textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');const ps=Math.round(3600/cfg.speed);$('pace').textContent=Math.floor(ps/60)+':'+String(ps%60).padStart(2,'0');$('coords').textContent='当前位置 '+p.lat.toFixed(6)+', '+p.lon.toFixed(6)+' · '+points.length+' 个采样点'}
function tick(now){if(running){const dt=Math.max(0,(now-last)/1000)*Number($('rate').value),end=cfg.target/(cfg.speed/3.6),next=Math.min(elapsed+dt,end);let t=Math.floor(elapsed)+1;for(;t<=next;t++)add(t);elapsed=next;if(elapsed>=end){if(points[points.length-1].distance<cfg.target)add(end);running=false;$('status').textContent='已完成目标距离'}draw()}last=now;requestAnimationFrame(tick)}
$('start').onclick=()=>{if(!cfg)return;const end=cfg.target/(cfg.speed/3.6);if(elapsed>=end)reset();if(!cfg)return;running=true;last=performance.now();$('status').textContent='正在模拟（设置修改后请点击重置应用）'};$('pause').onclick=()=>{running=false;$('status').textContent='已暂停，可继续'};$('reset').onclick=reset;
$('locate').onclick=()=>{if(!navigator.geolocation){$('status').textContent='当前浏览器不支持定位，请手动填写坐标';return}$('status').textContent='正在请求电脑定位…';navigator.geolocation.getCurrentPosition(p=>{$('lat').value=p.coords.latitude.toFixed(6);$('lon').value=p.coords.longitude.toFixed(6);reset()},e=>{$('status').textContent='定位失败：'+e.message+'。请手动填写坐标。'},{timeout:15000})};
function download(format){if(points.length<2){$('status').textContent='请先开始模拟，至少生成两个采样点';return}const body=format==='json'?JSON.stringify({type:'simulated-run',coordinateSystem:'WGS84',settings:cfg,points},null,2):'<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="VirtualRun" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>虚拟跑步测试轨迹</name></metadata><trk><name>模拟跑步</name><trkseg>'+points.map(p=>'<trkpt lat="'+p.lat+'" lon="'+p.lon+'"><time>'+p.time+'</time></trkpt>').join('\n')+'</trkseg></trk></gpx>';const url=URL.createObjectURL(new Blob([body],{type:format==='json'?'application/json':'application/gpx+xml'})),a=document.createElement('a');a.href=url;a.download='virtual-run.'+format;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('gpx').onclick=()=>download('gpx');$('json').onclick=()=>download('json');window.addEventListener('resize',draw);reset();requestAnimationFrame(tick);
</script></html>
